services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: momentum-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Hay dat DB_PASSWORD trong tep .env}"
    expose:
      - "1433"
    volumes:
      - momentum_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build: .
    container_name: momentum-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SESSION_SECRET: "${SESSION_SECRET:?Hay dat SESSION_SECRET trong tep .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-MomentumDB}"
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:init && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  momentum_sql_data:
